name: Daily Job Search Digest

on:
  schedule:
    # 03:00 UTC = 08:30 IST, once every 24 hours.
    # GitHub does not guarantee exact timing on schedule triggers, especially
    # under platform load -- treat this as "once a day", not "at exactly 08:30".
    - cron: "0 3 * * *"
  workflow_dispatch: {}
    # Lets you trigger a run manually from the Actions tab to test without
    # waiting for the schedule.

permissions:
  contents: read

env:
  # Keep in step with config.json -> local_model. Small enough to generate on
  # a 4-vCPU runner without a GPU; the cache key below is derived from it.
  LOCAL_MODEL: llama3.2:3b

jobs:
  search-and-notify:
    runs-on: ubuntu-latest
    # Generation is CPU-only, so the budget is wall clock rather than spend.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: job-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # The ATS memory is the one piece of state that must survive between
      # runs. It lives in the cache rather than the repo because the repo is
      # public; a fresh key per run with a shared prefix means each run saves
      # an updated copy and restores the most recent one.
      - name: Restore ATS memory
        uses: actions/cache@v4
        with:
          path: job-agent/output/ats_memory.json
          key: ats-memory-${{ github.run_id }}
          restore-keys: ats-memory-

      # Career memory: which boards work, which are dead or login-only, and
      # which jobs were already seen. Same cache pattern as the ATS memory.
      - name: Restore career memory
        uses: actions/cache@v4
        with:
          path: job-agent/output/career_memory.json
          key: career-memory-${{ github.run_id }}
          restore-keys: career-memory-

      - name: Cache the local model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.LOCAL_MODEL }}-v1

      - name: Install and start the local model server
        env:
          # The installer registers a systemd service running as the `ollama`
          # user, which stores models under /usr/share/ollama and so misses the
          # cache path above. Run our own server against a known directory.
          OLLAMA_MODELS: /home/runner/.ollama/models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          ollama serve > /tmp/ollama-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          # No-op when the cache already provided the blobs.
          ollama pull "$LOCAL_MODEL"
          ollama list
          du -sh "$OLLAMA_MODELS" || true

      - name: Run job search agent
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Neon: shortlist, outcomes and memories shared with apply.py on your PC.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STATUS_API_URL: ${{ vars.STATUS_API_URL }}
          STATUS_API_TOKEN: ${{ secrets.STATUS_API_TOKEN }}
        run: python main.py
