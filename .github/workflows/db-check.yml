name: Database connection check

# Manual only. Connects with the DATABASE_URL secret and reports whether the
# connection works -- database name, server version and table count. The URL
# itself is never printed (GitHub also masks secrets in logs).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Postgres driver
        run: pip install "psycopg[binary]>=3.2"

      - name: Connect and report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys
          import psycopg

          url = os.environ.get("DATABASE_URL", "")
          if not url:
              sys.exit("DATABASE_URL secret is not set.")
          # Shape checks only -- these never print any part of the value.
          checks = {
              "starts with postgresql:// or postgres://": url.startswith(("postgresql://", "postgres://")),
              "no surrounding quotes": url[:1] not in "'\"" and url[-1:] not in "'\"",
              "no leading/trailing whitespace or newline": url == url.strip(),
              "no 'DATABASE_URL=' prefix": not url.startswith("DATABASE_URL"),
              "no 'psql' command wrapper": not url.startswith("psql"),
              "contains a password (user:pass@)": url.count("@") == 1 and ":" in url.split("@")[0].split("//")[-1],
              "has a database name (/neondb)": "/" in url.split("@")[-1],
          }
          for name, ok in checks.items():
              print(f"  [{'ok' if ok else 'PROBLEM'}] {name}")
          try:
              with psycopg.connect(url, connect_timeout=15) as conn:
                  db, version = conn.execute("select current_database(), current_setting('server_version')").fetchone()
                  tables = conn.execute(
                      "select count(*) from information_schema.tables where table_schema = 'public'"
                  ).fetchone()[0]
                  rows = {
                      name: conn.execute(f"select count(*) from {name}").fetchone()[0]
                      for (name,) in conn.execute(
                          "select table_name from information_schema.tables where table_schema = 'public' order by 1"
                      ).fetchall()
                  }
          except Exception as error:
              # Error class only: messages can echo connection details.
              sys.exit(f"Connection FAILED: {type(error).__name__}")
          print(f"Connected OK: database={db}, Postgres {version}, public tables={tables}")
          for name, count in rows.items():
              print(f"  {name}: {count} rows")
          PY
