name: Sync approvals

# Copies the Submit / Fill only / Skip decisions you click in the digest
# email from the Cloudflare Worker into Neon, so apply.py on your PC sees
# them within half an hour. Counts only in the logs.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: job-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "psycopg[binary]>=3.2" requests python-dotenv
      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STATUS_API_URL: ${{ vars.STATUS_API_URL }}
          STATUS_API_TOKEN: ${{ secrets.STATUS_API_TOKEN }}
        run: python sync_approvals.py
